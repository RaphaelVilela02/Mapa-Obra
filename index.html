<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa da Obra</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F3864">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="icon" href="icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: ferramenta de fiscalização de campo — direta, sóbria, legível no sol
   IDEA: a prancha do projeto é o quadro de liberação; a ficha do ambiente é a FVS
   PICTURE: planta real ao centro, ambientes coloridos por situação
   COLOUR and TYPE: superfície neutra, tinta escura, azul FVS só em ação; verde C, vermelho NC, cinza NA, âmbar pendente; Archivo
   LAYOUT: NCs e setores à esquerda, mapa ao centro, ficha do ambiente à direita; no celular: mapa, ficha, NCs */
:root{color-scheme:light;--bg:light-dark(#eef0f3,#0f1113);--panel:light-dark(#fff,#181b1f);--ink:light-dark(#151a21,#e8ebf0);--mute:light-dark(#5d6674,#97a0ad);--line:light-dark(#dfe3e8,#2a2f36);--soft:light-dark(#f6f7f9,#1e2227);
--acc:light-dark(#1F3864,#9db8ea);--accb:light-dark(#1F3864,#2f5597);--c:#2e7d32;--nc:#c62828;--na:#8d939b;--pend:#d99a00;--ini:#a3b1c2}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip}
button,select,input,textarea{font:inherit}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #5b8def;outline-offset:1px}
.btn{font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 12px;min-height:40px;cursor:pointer}
.btn.pri{background:var(--accb);color:#fff;border-color:var(--accb)}
.btn:disabled{opacity:.5;cursor:default}
select,textarea,input[type=text],input[type=email],input[type=password]{font-size:16px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.meta{color:var(--mute);font-size:13px}
/* topo */
header{background:linear-gradient(90deg,#1F3864 0 78%,#2f5597 78% 92%,#c8102e 92%) top/100% 5px no-repeat,#fff;border-bottom:1px solid var(--line);padding:18px max(2vw,14px) 12px}
.brand{display:flex;gap:12px;align-items:center}
.logo{flex:none;width:44px;height:44px;border-radius:10px;background:#1F3864;display:grid;place-items:center}
header h1{color:#1F3864}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:12px;border:1px solid #c9d3e6;background:#eef3fb;color:#1F3864;border-radius:99px;padding:1px 9px;white-space:nowrap}
.top{display:flex;gap:12px 24px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
header h1{margin:0;font-size:clamp(19px,2vw,24px);line-height:1.15;font-weight:700;text-wrap:balance}
header p{margin:3px 0 0}
.auth{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;max-width:380px}
.auth[hidden],#loginbox[hidden],#senhabox[hidden]{display:none}
#loginbox,#senhabox{display:grid;gap:6px;width:100%;background:var(--soft);border:1px solid var(--line);padding:10px;border-radius:10px}
.kpis{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.kpi{background:#fff;border:1px solid var(--line);border-left:4px solid #1F3864;border-radius:10px;padding:8px 14px;min-width:150px}
.kpi.ok{border-left-color:var(--c)}.kpi.bad{border-left-color:var(--nc)}.kpi.pd{border-left-color:var(--pend)}
.kpi b{display:block;font-size:22px;line-height:1.15}.kpi span{font-size:12.5px;color:var(--mute)}
.kpi.bad b{color:var(--nc)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px max(2vw,14px);background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 12px;min-height:40px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--accb);color:#fff;border-color:var(--accb)}
.sp{flex:1}
.banner{background:#fff3cd;color:#5c4400;padding:8px max(2vw,14px);font-size:13px;display:none}.banner.on{display:block}
/* grade principal */
main{display:grid;grid-template-columns:300px minmax(0,1fr) 430px;grid-template-areas:"left map side";align-items:start}
#left{grid-area:left;padding:12px;display:grid;gap:12px;align-content:start}
.mapwrap{grid-area:map;position:sticky;top:57px;height:calc(100vh - 57px);min-height:420px;background:light-dark(#fff,#0c0e10);border-inline:1px solid var(--line)}
aside{grid-area:side;background:var(--panel);min-height:calc(100vh - 57px)}
@media(min-width:1251px){#left{position:sticky;top:57px;max-height:calc(100vh - 57px);overflow:auto}}
@media(max-width:1250px){main,main.hl{grid-template-columns:minmax(0,1fr) 410px;grid-template-areas:"map side" "left left"}main.hr,main.hl.hr{grid-template-columns:minmax(0,1fr);grid-template-areas:"map" "left"}#togL{display:none}main.hl #left{display:grid}#left{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start}}
@media(max-width:900px){main,main.hl,main.hr,main.hl.hr{grid-template-columns:1fr;grid-template-areas:"map" "side" "left"}.tog{display:none}main.hr aside{display:block}.zoom{right:12px}.mapwrap{position:relative;top:0;height:60vh;border-inline:0;border-bottom:1px solid var(--line)}aside{min-height:0}.bar{position:static}}
#map{width:100%;height:100%;touch-action:none;cursor:grab;display:block}#map.drag{cursor:grabbing}
.sec{cursor:pointer;stroke-width:1.2;fill-opacity:.42;transition:fill-opacity .15s}.sec:hover{fill-opacity:.62}
.sec.sel{stroke:var(--ink);stroke-width:3;fill-opacity:.62}.pin{stroke:#fff;stroke-width:2.5}
.tog{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:28px;height:64px;border:1px solid var(--line);background:#fff;color:#1F3864;cursor:pointer;display:grid;place-items:center;box-shadow:0 1px 4px #0002}
.tog svg{transition:transform .15s}#togL{left:0;border-left:0;border-radius:0 10px 10px 0}#togR{right:0;border-right:0;border-radius:10px 0 0 10px}
main.hl #togL svg,main.hr #togR svg{transform:rotate(180deg)}
main.hl #left,main.hr aside{display:none}
main.hl{grid-template-columns:minmax(0,1fr) 430px;grid-template-areas:"map side"}
main.hr{grid-template-columns:300px minmax(0,1fr);grid-template-areas:"left map"}
main.hl.hr{grid-template-columns:minmax(0,1fr);grid-template-areas:"map"}
.zoom{position:absolute;right:40px;top:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:44px;height:44px;font-size:20px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;box-shadow:0 1px 4px #0002}
.hint{position:absolute;left:12px;bottom:12px;background:var(--panel);padding:5px 9px;border-radius:8px;border:1px solid var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--mute)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* cartões da esquerda */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card>h2,.card>summary{font-size:15px;margin:0;padding:12px 14px;display:flex;gap:8px;align-items:center;cursor:default}
.card>summary{cursor:pointer;list-style:none}.card>summary::-webkit-details-marker{display:none}
.card>summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);transition:transform .15s}
.card[open]>summary::after{transform:rotate(-135deg)}
.count{font-size:12px;font-weight:700;border-radius:99px;padding:1px 8px;background:var(--soft);color:var(--mute)}
.count.bad{background:var(--nc);color:#fff}
.ncl{list-style:none;margin:0;padding:0;max-height:min(46vh,520px);overflow:auto;border-top:1px solid var(--line)}
.ncl li{border-bottom:1px solid var(--line)}.ncl li:last-child{border-bottom:0}
.ncl button{all:unset;display:block;width:100%;box-sizing:border-box;padding:10px 14px;cursor:pointer;border-left:4px solid var(--nc)}
.ncl button:hover,.ncl button:focus-visible{background:var(--soft)}
.ncl b{display:block;font-size:14px}.ncl .q{font-size:13px}.ncl .o{font-size:13px;color:var(--nc)}
.empty-s{padding:10px 14px 14px;color:var(--mute);font-size:13.5px;border-top:1px solid var(--line)}
.setl{list-style:none;margin:0;padding:0;border-top:1px solid var(--line);max-height:60vh;overflow:auto}
.setl button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:4px 8px;align-items:center;padding:8px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
.setl button:hover,.setl button:focus-visible,.setl button[aria-current=true]{background:var(--soft)}
.setl .nm{font-size:14px}.setl .pc{font-size:12.5px;color:var(--mute);white-space:nowrap}
.setl .mini{grid-column:2/4}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.mini{height:5px;border-radius:3px;background:var(--line);display:flex;overflow:hidden}.mini span{height:100%}
/* ficha */
.empty{padding:28px 22px;color:var(--mute)}.empty h2{color:var(--ink);font-size:18px;margin:0 0 6px}
.head{padding:16px 18px 14px;border-bottom:1px solid var(--line)}
.head h2{margin:2px 0 0;font-size:22px;line-height:1.15}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;color:#fff;font-size:13px;font-weight:600;margin-top:8px}
.etapa{margin-top:8px;font-size:14px}.etapa b{color:var(--acc)}
.prog{height:10px;border-radius:5px;background:var(--line);display:flex;overflow:hidden;margin-top:8px}.prog span{display:block;height:100%}
.counts{display:flex;gap:12px;font-size:12px;color:var(--mute);margin-top:5px;flex-wrap:wrap}
h3{font-size:13px;color:var(--mute);margin:16px 18px 8px;font-weight:600}
.pics{padding:0 18px 4px}.gal-f{display:flex;gap:8px;align-items:center;margin-bottom:8px}.gal-f select{flex:1;font-size:14px;padding:6px 8px}
.gal{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:8px}
.th{position:relative;padding:0;border:0;border-radius:6px;overflow:hidden;aspect-ratio:1;cursor:pointer;background:var(--line);display:block;width:100%}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th span{position:absolute;left:0;right:0;bottom:0;background:#000a;color:#fff;font-size:10.5px;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.th.sm{width:120px;margin-top:6px}
/* serviços (acordeão) */
.svcs{border-top:1px solid var(--line)}
.svc{border-bottom:1px solid var(--line)}
.sh{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:30px minmax(0,1fr) auto 14px;gap:4px 10px;align-items:center;padding:11px 18px;cursor:pointer}
.sh:hover{background:var(--soft)}.sh:focus-visible{outline:3px solid #5b8def;outline-offset:-3px}
.sh .ix{font-weight:700;color:var(--mute);font-size:13px}
.sh .nm{font-weight:600;font-size:14.5px}.sh .nm small{display:block;font-weight:400;color:var(--mute);font-size:12.5px}
.sh .chev{width:8px;height:8px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);transition:transform .15s}
.sh[aria-expanded=true] .chev{transform:rotate(-135deg)}
.sh .mini{grid-column:2/4}
.stb{font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 7px;color:#fff;white-space:nowrap}
.items{background:var(--soft);padding:4px 0 10px}
.svcact{display:flex;justify-content:flex-end;padding:6px 18px 0}
.lnk{font:inherit;font-size:12.5px;color:var(--acc);background:none;border:0;padding:0 2px;text-decoration:underline;cursor:pointer;min-height:28px}
.et{font-size:11.5px;font-weight:700;color:var(--mute);padding:10px 18px 2px;letter-spacing:.02em}
.it{margin:6px 12px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.it.isnc{border-color:var(--nc);box-shadow:inset 4px 0 0 var(--nc)}
.it.flash{animation:fl 1.6s}@keyframes fl{0%,40%{background:light-dark(#fff3cd,#3a3214)}}
.it .row{display:flex;gap:8px;align-items:flex-start}
.it .nm{flex:1;font-weight:600;font-size:14px}.it .nm em{font-style:normal;color:var(--mute);font-weight:700;margin-right:4px}
.it .nm small{display:block;font-weight:400;color:var(--mute);font-size:12.5px;line-height:1.4;margin-top:2px}
.it .nm small b{font-weight:600;color:var(--ink)}
.ctl{display:flex;gap:6px;flex:none}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{font-size:13px;font-weight:700;width:42px;height:38px;border:0;border-left:1px solid var(--line);background:var(--panel);color:var(--mute);cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[data-on=C]{background:var(--c);color:#fff}.seg button[data-on=NC]{background:var(--nc);color:#fff}.seg button[data-on=NA]{background:var(--na);color:#fff}
.cam{flex:none;width:42px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--acc);cursor:pointer;display:grid;place-items:center}
.it input{width:100%;margin-top:8px;font-size:14px;padding:6px 9px}
.who{font-size:12px;color:var(--mute);margin-top:4px}
@media(max-width:520px){.it .row{flex-wrap:wrap}.ctl{width:100%;justify-content:flex-end}}
/* comentários */
.cm{padding:0 18px 22px}.cm textarea{width:100%;min-height:70px;resize:vertical;margin-top:6px}
.cm select{width:100%;font-size:14px}
.cm .act{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.prev{margin:8px 0;display:grid;gap:6px;justify-items:start}.prev img{max-width:100%;max-height:240px;border-radius:8px;border:1px solid var(--line)}
.feed{list-style:none;margin:12px 0 0;padding:0}.feed li{border-top:1px solid var(--line);padding:9px 0;font-size:14px}
.feed .t{font-size:12px;color:var(--mute)}
.tag{font-size:11.5px;border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-right:4px;color:var(--mute)}
.hist{margin-top:14px}.hist summary{cursor:pointer;color:var(--mute);font-size:13px;padding:6px 0}
/* visualizador de foto */
.lb{position:fixed;inset:0;background:#0b0b0bf5;z-index:50;display:grid;place-items:center;padding:12px}.lb[hidden]{display:none}
.lbbox{max-width:min(1200px,100%);max-height:100%;display:grid;gap:8px;grid-template-rows:minmax(0,1fr) auto}
.lbbox img{max-width:100%;max-height:calc(100vh - 130px);object-fit:contain;margin:auto;border-radius:6px}
.lbbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:#fff;font-size:14px}.lbbar .meta{color:#bbb}
.lbbar .btn{background:#222;color:#fff;border-color:#555;text-decoration:none;display:inline-flex;align-items:center}
.lbbar .btn.pri{background:#fff;color:#111}.lbbar .btn.del{border-color:#e57373;color:#ffb4b4}.lbbar .btn.del.arm{background:var(--nc);color:#fff}
/* barra: vista, filtro, ações */
.seg2{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg2 button{border:0;border-left:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 12px;min-height:40px;cursor:pointer;font-size:14px}
.seg2 button:first-child{border-left:0}.seg2 button[aria-pressed=true]{background:#1F3864;color:#fff}
.bar select{font-size:14px;padding:7px 8px;max-width:230px}
.bar .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.obx{font-size:12.5px;font-weight:600;color:#7a5200;background:#fff3cd;border:1px solid #f0d48a;border-radius:99px;padding:3px 10px}
.obx[hidden]{display:none}
/* mapa: filtro */
.sec.dim{fill:#9aa3ad!important;stroke:#9aa3ad!important;fill-opacity:.12!important;stroke-opacity:.4}
/* NC: abas e detalhes */
.ncf{display:flex;gap:4px;padding:0 14px 10px;flex-wrap:wrap}
.ncf button{font-size:12.5px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:3px 10px;cursor:pointer;min-height:30px}
.ncf button[aria-pressed=true]{background:#1F3864;color:#fff;border-color:#1F3864}
.ncl .nn{font-size:12px;font-weight:700;color:var(--nc)}
.late{color:var(--nc);font-weight:700}
.tagw{font-size:11px;font-weight:700;border-radius:5px;padding:0 5px;background:#fff3cd;color:#7a5200;margin-left:4px}
.ncbox{margin-top:8px;border:1px solid #f1c4c4;background:#fdf3f3;border-radius:8px;padding:8px;display:grid;gap:6px}
.ncbox .hd{font-size:12.5px;font-weight:700;color:var(--nc)}
.ncbox label{font-size:12px;color:var(--mute);display:grid;gap:2px}
.ncbox input{margin:0!important;font-size:14px}
.ncbox .two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.warn{margin-top:8px;font-size:13px;color:#7a5200;background:#fff3cd;border-radius:8px;padding:6px 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ad{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.ad figure{margin:0}.ad figcaption{font-size:11.5px;font-weight:700;color:var(--mute);margin-bottom:2px}
.ad .th{aspect-ratio:4/3}
.ad .none{aspect-ratio:4/3;border:1px dashed var(--line);border-radius:6px;display:grid;place-items:center;font-size:12px;color:var(--mute)}
/* recebimento */
.recb{margin-top:10px;padding:10px;border-radius:10px;background:#eef3fb;border:1px solid #c9d3e6;font-size:13.5px}
.recb b{color:#1F3864}
/* painel */
#painel{padding:14px max(2vw,14px) 40px;display:grid;gap:14px}#painel[hidden],main[hidden]{display:none!important}
.pcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.pcard h2{font-size:16px;margin:0 0 4px}.pcard .meta{margin:0 0 10px}
.fig{position:relative;height:240px}.fig svg{position:absolute;inset:0;width:100%;height:100%}
.mx{overflow:auto;max-height:70vh}
.mx table{border-collapse:separate;border-spacing:0;font-size:13px;width:100%}
.mx th,.mx td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.mx th{position:sticky;top:0;background:#fff;z-index:1;font-size:12px;color:var(--mute);font-weight:600;vertical-align:bottom}
.mx td:first-child,.mx th:first-child{text-align:left;position:sticky;left:0;background:#fff;z-index:2;white-space:normal;min-width:170px}
.cell{all:unset;cursor:pointer;display:inline-block;min-width:46px;border-radius:6px;padding:3px 4px;color:#fff;font-weight:700;font-size:12px}
.cell.e{color:var(--ink);background:#eef0f3}
.cell:focus-visible{outline:3px solid #5b8def}
/* diálogos */
.dlg{position:fixed;inset:0;background:#0b1a33aa;z-index:40;display:grid;place-items:center;padding:12px}.dlg[hidden]{display:none}
.dbox{background:#fff;border-radius:14px;width:min(640px,100%);max-height:calc(100vh - 24px);overflow:auto;box-shadow:0 20px 60px #0005}
.dbox header{all:unset;display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:1}
.dbox header h2{font-size:17px;margin:0;flex:1;color:#1F3864}
.dbody{padding:14px 18px;display:grid;gap:12px}
.dbody label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
.dbody fieldset{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:0}
.dbody legend{font-size:13px;color:var(--mute);padding:0 4px}
.chk{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:2px 10px;max-height:220px;overflow:auto}
.chk label{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px;min-height:32px}
.chk input{width:18px;height:18px}
.dfoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:#fff;flex-wrap:wrap;align-items:center}
.sig{border:1px dashed #9aa3ad;border-radius:8px;background:#fafbfc;touch-action:none;width:100%;height:150px;display:block}
/* editor de foto */
.ed{position:fixed;inset:0;background:#0b0b0b;z-index:60;display:grid;grid-template-rows:auto minmax(0,1fr) auto;color:#fff}.ed[hidden]{display:none}
.edtop,.edbot{display:flex;gap:8px;align-items:center;padding:10px 12px;flex-wrap:wrap}
.edtop .t{flex:1;font-size:14px;min-width:160px}
.ed button.tool{background:#222;color:#fff;border:1px solid #555;border-radius:8px;min-height:42px;padding:6px 12px;cursor:pointer;font-size:14px}
.ed button.tool[aria-pressed=true]{background:#ff1744;border-color:#ff1744}
.edc{position:relative;display:grid;place-items:center;overflow:hidden;min-height:0}
.edc canvas{touch-action:none;cursor:crosshair;display:block}
.edbot input{flex:1;min-width:180px;font-size:16px;border-radius:8px;border:0;padding:10px}
.ed .btn{min-height:42px}
/* relatório */
.rep{position:fixed;inset:0;background:#e9ecf0;z-index:70;overflow:auto}.rep[hidden]{display:none}
.reptb{position:sticky;top:0;display:flex;gap:8px;padding:10px 14px;background:#1F3864;color:#fff;align-items:center;z-index:2}
.reptb .t{flex:1;font-weight:600}
.paper{background:#fff;color:#111;margin:14px auto;padding:12mm;width:min(297mm,100%);box-shadow:0 2px 10px #0002;font:11px/1.35 Arial,Helvetica,sans-serif}
.paper.p{width:min(210mm,100%)}
.paper h1{font-size:15px;margin:0;color:#fff;background:#1F3864;padding:6px 8px}
.paper .hdr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid #9aa;margin:6px 0 10px}
.paper .hdr div{padding:3px 6px;border-right:1px solid #ccd;border-bottom:1px solid #ccd}
.paper .hdr b{display:block;font-size:9px;color:#1F3864;background:#D9E1F2;margin:-3px -6px 2px;padding:1px 6px}
.paper table{width:100%;border-collapse:collapse;margin-bottom:8px}
.paper th{background:#D9E1F2;color:#1F3864;font-size:10px;text-align:left}
.paper th,.paper td{border:1px solid #aab;padding:3px 5px;vertical-align:top}
.paper .sv td{background:#1F3864;color:#fff;font-weight:700}
.paper .rC{background:#C6EFCE;color:#006100;font-weight:700;text-align:center}.paper .rNC{background:#FFC7CE;color:#9C0006;font-weight:700;text-align:center}.paper .rNA{background:#E7E6E6;color:#555;font-weight:700;text-align:center}.paper .rP{text-align:center;color:#999}
.paper .foot{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid #9aa;margin:8px 0}
.paper .foot div{padding:4px 6px;border-right:1px solid #ccd;text-align:center}.paper .foot b{display:block;font-size:13px}
.paper .stL{background:#C6EFCE;color:#006100}.paper .stB{background:#FFC7CE;color:#9C0006}.paper .stE{background:#FFF2CC;color:#7a5200}
.paper .sigs{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:22px}
.paper .sigs div{border-top:1px solid #333;padding-top:3px;text-align:center;min-height:20px}.paper .sigs img{height:60px;display:block;margin:-66px auto 6px}
.paper .pg{break-before:page}
.paper .ph{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.paper .ph figure{margin:0;break-inside:avoid;border:1px solid #ccd;padding:4px}
.paper .ph img{width:100%;height:auto;max-height:95mm;object-fit:contain;display:block;background:#f3f3f3}
.paper .ph figcaption{font-size:10px;margin-top:3px}
.paper .ph.three{grid-template-columns:repeat(3,1fr)}.paper .ph.three img{max-height:60mm}
.paper .note{font-size:10px;color:#555;margin-top:6px}
@media print{body>*:not(#rep){display:none!important}.rep{position:static;background:#fff;overflow:visible}.reptb{display:none}.paper{box-shadow:none;margin:0;padding:0;width:auto}}
@media(max-width:600px){header{padding:12px 12px 8px}.logo{width:34px;height:34px}.logo svg{width:20px;height:20px}header h1{font-size:17px}.chips .chip:nth-child(n+3){display:none}
.kpis{gap:6px;margin-top:8px}.kpi{min-width:0;flex:1 1 calc(50% - 6px);padding:5px 10px}.kpi b{font-size:18px}.kpi span{font-size:11.5px}
.bar{gap:6px;padding:8px 10px}.bar .meta{display:none}.bar .grp{flex:1 1 calc(50% - 6px)}.bar select{max-width:none;width:100%}.bar .grp .btn{flex:1}
.tabs{width:100%;flex-wrap:nowrap;overflow-x:auto}.tabs button{flex:none}}
@media(prefers-reduced-motion:reduce){.sec,.sh .chev,.card>summary::after{transition:none}.it.flash{animation:none}}
</style>
</head>
<body>
<header>
  <div class="top"><div class="brand"><div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="26" height="26"><path fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round" d="M3 4h18v16H3zM3 11h8v9M11 4v4M15 11h6M15 11v9"/><circle cx="18" cy="16" r="1.6" fill="#ff6b6b"/></svg></div>
  <div><h1 id="ttl"></h1><div class="chips" id="sub"></div></div></div>
  <div id="auth" class="auth" hidden><span class="obx" id="obx" hidden></span><button class="btn" id="inst" hidden>Instalar app</button><span id="authtxt">Somente leitura</span><button class="btn" id="login">Entrar</button><button class="btn" id="defsenha" hidden>Definir senha</button><button class="btn" id="logout" hidden>Sair</button>
  <form id="loginbox" hidden><label for="email">E-mail</label><input type="email" id="email" autocomplete="email" required>
  <label for="senha">Senha</label><input type="password" id="senha" autocomplete="current-password">
  <button class="btn pri" id="entrar">Entrar com senha</button>
  <button class="btn" type="button" id="link">Primeiro acesso / esqueci a senha: receber link por e-mail</button>
  <div id="loginmsg" class="meta"></div></form>
  <form id="senhabox" hidden><label for="nova">Crie uma senha (mín. 8 caracteres)</label><input type="password" id="nova" autocomplete="new-password" minlength="8" required>
  <button class="btn pri">Salvar senha</button><div id="senhamsg" class="meta"></div></form></div></div>
  <div class="kpis" id="kpis"></div>
</header>
<div class="banner" id="banner"></div>
<div class="bar">
  <div class="seg2" role="group" aria-label="Visualização"><button id="vMapa" aria-pressed="true">Mapa</button><button id="vPainel" aria-pressed="false">Painel</button></div>
  <div class="tabs" id="tabs" role="group" aria-label="Planta"></div>
  <span class="sp"></span>
  <div class="grp"><label for="mode" class="meta">Colorir por</label><select id="mode"></select></div>
  <div class="grp"><label for="filt" class="meta">Mostrar</label><select id="filt"></select></div>
  <div class="grp"><button class="btn" id="bLote" hidden>Liberar em lote</button><button class="btn pri" id="bRel">Relatórios</button></div>
</div>
<section id="painel" hidden></section>
<main id="main">
  <div id="left">
    <section class="card" id="nccard"></section>
    <details class="card" id="setcard"></details>
  </div>
  <div class="mapwrap">
    <button class="tog" id="togL" aria-label="Ocultar painel de não conformidades" title="Ocultar/mostrar painel"><svg viewBox="0 0 10 16" width="10" height="16" aria-hidden="true"><path d="M8 2 2 8l6 6" fill="none" stroke="currentColor" stroke-width="2.2"/></svg></button>
    <button class="tog" id="togR" aria-label="Ocultar ficha do ambiente" title="Ocultar/mostrar painel"><svg viewBox="0 0 10 16" width="10" height="16" aria-hidden="true"><path d="M2 2l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2"/></svg></button>
    <svg id="map" aria-label="Planta baixa interativa"></svg>
    <div class="zoom"><button id="zin" aria-label="Aproximar">+</button><button id="zout" aria-label="Afastar">−</button><button id="zfit" aria-label="Enquadrar">⤢</button></div>
    <div class="hint" id="legend"></div>
  </div>
  <aside id="side" aria-live="polite"></aside>
</main>
<div id="lb" class="lb" hidden role="dialog" aria-label="Foto"><div class="lbbox"><img id="lbimg" alt="Foto do ambiente"><div class="lbbar"><span id="lbcap"></span><span class="sp"></span><span id="lbn" class="meta"></span>
<button class="btn" id="lbprev" aria-label="Foto anterior">‹</button><button class="btn" id="lbnext" aria-label="Próxima foto">›</button><a class="btn" id="lbopen" target="_blank" rel="noopener">Abrir original</a><button class="btn del" id="lbdel" hidden>Excluir foto</button><button class="btn pri" id="lbclose">Fechar</button></div></div></div>
<div class="dlg" id="dlg" hidden role="dialog" aria-modal="true"><div class="dbox" id="dbox"></div></div>
<div class="ed" id="ed" hidden role="dialog" aria-label="Marcar foto">
  <div class="edtop"><span class="t" id="edt"></span><button class="tool" data-tool="circ" aria-pressed="true">◯ Círculo</button><button class="tool" data-tool="seta" aria-pressed="false">↗ Seta</button><button class="tool" data-tool="livre" aria-pressed="false">✎ Livre</button><button class="tool" id="edundo">Desfazer</button></div>
  <div class="edc" id="edc"><canvas id="edcv"></canvas></div>
  <div class="edbot"><input type="text" id="ednote" placeholder="Descrição curta (opcional) — vai gravada na foto" maxlength="120" aria-label="Descrição"><button class="btn" id="edcancel">Cancelar</button><button class="btn" id="edall" hidden>Enviar todas sem marcar</button><button class="btn pri" id="edok">Enviar foto</button></div>
</div>
<div class="rep" id="rep" hidden><div class="reptb"><span class="t" id="rept"></span><button class="btn" id="repprint">Imprimir / salvar PDF</button><button class="btn" id="repclose">Fechar</button></div><div id="repbody"></div></div>
<input type="file" id="file" accept="image/*" multiple hidden>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="dados.js?v=202611271125"></script>
<script src="app.js?v=202611271125"></script>
</body>
</html>
