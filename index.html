<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa da Obra — GBM Jaboatão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: canteiro de obras, objetivo, de fiscalização
   IDEA: a prancha do projeto vira o quadro de liberação — cada ambiente pinta conforme a FVS
   PICTURE: planta baixa real, ambientes coloridos por situação, clicáveis
   COLOUR and TYPE: papel branco, azul FVS #1F3864, verde C / vermelho NC / cinza NA / âmbar pendente; Archivo
   LAYOUT: mapa à esquerda, ficha do setor à direita (abaixo no celular), tabela de setores embaixo */
:root{color-scheme:light dark;--bg:light-dark(#f4f5f7,#121417);--panel:light-dark(#fff,#1b1e23);--ink:light-dark(#14181f,#e9ecf1);--mute:light-dark(#5b6472,#9aa3b2);--line:light-dark(#dde1e7,#2c313a);--blue:light-dark(#1F3864,#8fb0e8);--blueb:#1F3864;
--c:#2e7d32;--nc:#c62828;--na:#8d939b;--pend:#e0a100;--ini:#9fb0c4}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip}
header{background:var(--blueb);color:#fff;padding:18px max(3vw,16px) 16px}
header h1{margin:0;font-size:clamp(20px,2.6vw,30px);line-height:1.1;font-weight:700;text-wrap:balance}
header p{margin:4px 0 0;opacity:.8;font-size:13px}
.kpis{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:14px}
.kpi b{display:block;font-size:24px;line-height:1.1}.kpi span{font-size:12px;opacity:.8}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px max(3vw,16px);background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button,.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 12px;min-height:40px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--blueb);color:#fff;border-color:var(--blueb)}
select,textarea,input[type=text]{font:inherit;font-size:16px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #5b8def;outline-offset:1px}
.sp{flex:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mute)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
main{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:0;align-items:start}
.mapwrap{position:relative;height:calc(100vh - 64px);min-height:420px;background:light-dark(#fff,#0d0f12);border-right:1px solid var(--line);position:sticky;top:61px}
#map{width:100%;height:100%;touch-action:none;cursor:grab;display:block}
#map.drag{cursor:grabbing}
#map image{filter:var(--imgf,none)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--imgf:invert(.88) hue-rotate(180deg)}}
:root[data-theme=dark]{--imgf:invert(.88) hue-rotate(180deg)}
.sec{cursor:pointer;stroke-width:1.2;fill-opacity:.42;transition:fill-opacity .15s}
.sec:hover{fill-opacity:.62}
.sec.sel{stroke:#000;stroke-width:3;fill-opacity:.62}
:root[data-theme=dark] .sec.sel{stroke:#fff}
.pin{stroke:#fff;stroke-width:2.5}
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:44px;height:44px;font-size:20px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;box-shadow:0 1px 4px #0002}
.hint{position:absolute;left:12px;bottom:12px;font-size:12px;color:var(--mute);background:var(--panel);padding:4px 8px;border-radius:6px;border:1px solid var(--line)}
aside{background:var(--panel);min-height:calc(100vh - 64px)}
.empty{padding:28px 22px;color:var(--mute)}
.empty h2{color:var(--ink);font-size:18px;margin:0 0 6px}
.head{padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.head h2{margin:0;font-size:22px;line-height:1.15}
.meta{color:var(--mute);font-size:13px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;color:#fff;font-size:13px;font-weight:600;margin-top:8px}
.etapa{margin-top:10px;font-size:14px}.etapa b{color:var(--blue)}
.prog{height:10px;border-radius:5px;background:var(--line);display:flex;overflow:hidden;margin-top:8px}
.prog span{display:block;height:100%}
.counts{display:flex;gap:12px;font-size:12px;color:var(--mute);margin-top:5px;flex-wrap:wrap}
h3{font-size:13px;text-transform:none;color:var(--mute);margin:16px 20px 6px;font-weight:600}
.svc{padding:10px 20px;border-top:1px solid var(--line)}
.svc .row{display:flex;gap:8px;align-items:center}
.svc .nm{flex:1;font-weight:600;font-size:14px}
.svc .nm small{display:block;font-weight:400;color:var(--mute);font-size:12.5px;line-height:1.35;margin-top:2px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{font:inherit;font-size:13px;font-weight:700;width:44px;height:38px;border:0;border-left:1px solid var(--line);background:transparent;color:var(--mute);cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[data-on=C]{background:var(--c);color:#fff}.seg button[data-on=NC]{background:var(--nc);color:#fff}.seg button[data-on=NA]{background:var(--na);color:#fff}
.svc input{width:100%;margin-top:6px;font-size:14px;padding:6px 9px}
.who{font-size:12px;color:var(--mute);margin-top:3px}
.svc.isnc{background:light-dark(#fdf0f0,#2a1717)}
.cm{padding:0 20px 20px}
.cm textarea{width:100%;min-height:70px;resize:vertical}
.cm .act{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.btn.pri{background:var(--blueb);color:#fff;border-color:var(--blueb)}
.feed{list-style:none;margin:12px 0 0;padding:0}
.feed li{border-top:1px solid var(--line);padding:9px 0;font-size:14px}
.feed .t{font-size:12px;color:var(--mute)}
.feed img{max-width:100%;border-radius:6px;margin-top:6px;display:block}
.tag{font-size:11.5px;border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-right:4px;color:var(--mute)}
.top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.auth{font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:360px}
.auth .btn{background:transparent;color:#fff;border-color:#ffffff66}
#loginbox,#senhabox{display:grid;gap:6px;width:100%;background:#ffffff14;padding:10px;border-radius:8px}
#loginbox[hidden],#senhabox[hidden],.auth[hidden]{display:none}#loginbox input,#senhabox input{font-size:16px;padding:8px;border-radius:8px;border:0}
#loginbox .meta,#senhabox .meta,#loginbox label,#senhabox label{color:#fff;opacity:.85}
.auth .btn.pri{background:#fff;color:var(--blueb)}
.list{padding:20px max(3vw,16px) 40px}
.list h2{font-size:18px;margin:0 0 10px}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--mute);font-weight:600}
tbody tr{cursor:pointer}tbody tr:hover{background:light-dark(#f2f5fa,#22262d)}
td.num{text-align:right;white-space:nowrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.mini{height:6px;border-radius:3px;background:var(--line);width:110px;display:flex;overflow:hidden}
.mini span{height:100%}
.banner{background:#fff3cd;color:#5c4400;padding:8px max(3vw,16px);font-size:13px;display:none}
.banner.on{display:block}
@media(max-width:900px){.bar{position:static}main{grid-template-columns:1fr}.mapwrap{position:relative;top:0;height:62vh;border-right:0;border-bottom:1px solid var(--line)}aside{min-height:0}}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 10px;padding-inline-start:8.5em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;color:var(--mute);font-size:12px}.stack td:empty{display:none}}
@media(prefers-reduced-motion:reduce){.sec{transition:none}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<header>
  <div class="top"><div><h1 id="ttl"></h1>
  <p id="sub"></p></div>
  <div id="auth" class="auth" hidden><span id="authtxt">Somente leitura</span> <button class="btn" id="login">Entrar</button><button class="btn" id="defsenha" hidden>Definir senha</button><button class="btn" id="logout" hidden>Sair</button>
  <form id="loginbox" hidden><label for="email">E-mail</label><input type="email" id="email" autocomplete="email" required>
  <label for="senha">Senha</label><input type="password" id="senha" autocomplete="current-password">
  <button class="btn pri" id="entrar">Entrar com senha</button>
  <button class="btn" type="button" id="link">Primeiro acesso / esqueci a senha: receber link por e-mail</button>
  <div id="loginmsg" class="meta"></div></form>
  <form id="senhabox" hidden><label for="nova">Crie uma senha (mín. 8 caracteres) para entrar sem precisar de e-mail</label><input type="password" id="nova" autocomplete="new-password" minlength="8" required>
  <button class="btn pri">Salvar senha</button><div id="senhamsg" class="meta"></div></form></div></div>
  <div class="kpis" id="kpis"></div>
</header>
<div class="banner" id="banner"></div>
<div class="bar">
  <div class="tabs" id="tabs" role="group" aria-label="Planta"></div>
  <span class="sp"></span>
  <label for="mode" class="meta">Colorir por</label>
  <select id="mode"></select>
</div>
<main>
  <div class="mapwrap">
    <svg id="map" aria-label="Planta baixa interativa"></svg>
    <div class="zoom"><button id="zin" aria-label="Aproximar">+</button><button id="zout" aria-label="Afastar">−</button><button id="zfit" aria-label="Enquadrar">⤢</button></div>
    <div class="hint" id="legend"></div>
  </div>
  <aside id="side" aria-live="polite"></aside>
</main>
<section class="list">
  <h2 id="lt">Setores</h2>
  <table class="stack"><thead><tr><th>Setor</th><th>Etapa atual</th><th>Progresso</th><th class="num">NC</th><th>Situação</th></tr></thead><tbody id="tb"></tbody></table>
</section>
<input type="file" id="file" accept="image/*" hidden>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="dados.js"></script>
<script src="app.js"></script>
</body>
</html>
